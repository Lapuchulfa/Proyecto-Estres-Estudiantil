{% extends "admin/base.html" %}

{% block titulo %}Nuevo usuario{% endblock %}

{% block contenido %}
    <h1 class="page__title">Nuevo Usuario</h1>

    {% if errores %}
        <ul class="message message--mistake">
            {% for error in errores %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form class="form" method="POST" novalidate>
        <div class="form__field">
            <label class="form__tag" for="nombre">Nombre</label>
            <input class="form__input" type="text" id="nombre" name="nombre"
                   value="{{ datos.get('nombre', '') }}">
        </div>
        <div class="form__field">
            <label class="form__tag" for="apellido">Apellido</label>
            <input class="form__input" type="text" id="apellido" name="apellido"
                value="{{ datos.get('apellido', '') }}">
        </div>

        <div class="form__field">
            <label class="form__tag" for="correo">Correo</label>
            <input class="form__input" type="email" id="correo" name="correo"
                    value="{{datos.get('correo', '')}}">
        </div>

        <div class="form__field">
            <label class="form__tag" for="password">Contraseña</label>
            <input class="form__input" type="password" id="password" name="password">
            <small class="form__help">Mínimo 8 caracteres, con mayúsculas, minúsculas y números</small>
        </div>

        <div class="form__field">
            <label class="form__tag" for="rol">Rol</label>
            <select class="form__select" id="rol" name="rol">
                {% for rol in roles %}
                    <option value="{{rol}}" {% if datos.get('rol') == rol %}selected{% endif %}>{{rol}}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form__field">
            <label class="form__tag" for="arquetipo_id">Arquetipo</label>
            <select class="form__select" id="arquetipo_id" name="arquetipo_id">
                <option value="">-- Sin asignar --</option>
                {% for a in arquetipos %}
                    <option value="{{ a.arquetipo_id }}"
                        {% if datos.get('arquetipo_id') == a.arquetipo_id|string %}selected {%endif %}>
                        {{a.nombre_arquetipo}}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form__actions">
            <button class="button button--primary" type="submit">Guardar</button>
            <a class="button button--secondary" href="{{url_for('admin.usuarios_lista')}}">Cancelar</a>
        </div>
    </form>
{% endblock %}
