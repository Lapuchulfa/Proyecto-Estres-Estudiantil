<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='scss/admin.css')}}">
    <title>Registro Gestión del Estrés</title>
</head>
<body class="page">
    <main class="page__container page__container--center">
        <h1 class="page__title page__title--center">Crear cuenta de estudiante</h1>
        {% if errores %}
            <ul class="message message--mistake">
                {% for error in errores %}
                    <li>{{error}}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form class="form" method="POST" novalidate>
            <div class="form__field">
                <label class="form__tag" for="nombre">Nombre</label>
                <input class= "form__input" type="text" id="nombre" name="nombre"
                        value="{{datos.get('nombre', '')}}">
            </div>

            <div class="form__field">
                <label class="form__tag" for="apellido">Apellido</label>
                <input class="form__input" type="text" id="apellido" name="apellido"
                        value="{{datos.get('apellido','')}}">
            </div>

            <div class="form__field">
                <label class="form__tag" for="correo">Correo</label>
                <input class="form__input" type="email" id="correo" name="correo"
                        value="{{datos.get('correo','')}}">
            </div>

            <div class="form__field">
                <label class="form__tag" for="password">Contraseña</label>
                <input class="form__input" type="password" id="password" name="password">
                <small class="form__help">Mínimo 8 caracteres, con mayúscula, minúscula y número.</small>
            </div>

            <div class="form__field">
                <label class="form__tag" for="confirmar_password">Confirmar contraseña</label>
                <input class="form__input" type="password" id="confirmar_password" name="confirmar_password">
            </div>

            <div class="form__actions">
                <button class="button button--primary" type="submit">Crear cuenta</button>
                <a class="button button--secondary" href="{{url_for('auth.login')}}">Ya tengo cuenta</a>
            </div>
        </form>
    </main>
</body>
</html>
